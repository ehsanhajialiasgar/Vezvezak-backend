name = "vezvezak-api"
main = "src/index.js"
compatibility_date = "2026-07-01"

# D1 (SQLite) — create once with:
#   npx wrangler d1 create vezvezak
# then paste the printed database_id below.
[[d1_databases]]
binding = "DB"
database_name = "vezvezak"
database_id = "52d0794c-3e6e-4f82-b182-2441e50e4afb"

# Workers AI — used ONLY to moderate app reviews (genuine vs spam) so the
# one-time points reward can't be farmed. Optional: without it the API falls
# back to a deterministic quality check and reports verifiedByServer:false.
[ai]
binding = "AI"

# Observability is OFF (Ehsan 2026-08-11). Our published privacy policy states our
# servers do not log requests. Workers Observability captures the INVOCATION URL, and
# several vezvezak-api routes carry lat/lng and other data in the query string
# (index.js: nearby/verified/jobs) — so enabling this would log precise-ish location
# and make that privacy statement false. It was `enabled = true` in this file while
# the deployed worker had it OFF (observability:null) — a landmine that the next
# `wrangler deploy` would have tripped. Kept false, and enforced by
# scripts/observability-gate.mjs (fail-closed) so it cannot silently flip on again.
[observability]
enabled = false

# Secrets (NEVER put these in this file — it is committed):
#   npx wrangler secret put JWT_SECRET       # long random string; rotating it signs everyone out
#   npx wrangler secret put RESEND_API_KEY   # optional, enables emailed OTP codes
#
# Non-secret vars:
[vars]
MAIL_FROM = "Vezvezak <noreply@vezvezak.com>"
# AI FEATURE FLAG — DEFAULT OFF, fail-closed. /ai/normalize sends the search query to Workers AI
# (@cf/meta/m2m100-1.2b). Keeping this "0" is what keeps privacy §6 ("no data to any AI provider
# today") true — a route stays dark until the flag is flipped HERE, a committed + reviewable change,
# never by a bare `wrangler deploy`. Re-run the live translation harness (see src/translate.js,
# BUILT-HELD) before ever setting it to "1".
AI_NORMALIZE_ENABLED = "0"
# MODERATION FLAG — DEFAULT OFF, fail-closed. moderateReview() and moderateCatalogItem() send an app
# review's text, or a listing's title/description/brand/model, to Workers AI
# (@cf/meta/llama-3.3-70b-instruct-fp8-fast). Until 2026-09-03 the ONLY thing holding privacy §5
# ("it does not run for any user today — no review or listing text is sent to any model") was the plan
# gate below it: `pro || max`. That made a PUBLISHED LEGAL SENTENCE depend on a row in user_plans, so
# the first redeemed comp code would have falsified it with no code change, no deploy, and no gate
# firing. The flag sits ABOVE the plan gate — BOTH conditions, neither replaces the other — so the
# sentence is now true because of the code and stays true when the first account becomes paid.
# Flipping this to "1" is a committed, reviewable change and REQUIRES updating §5 first.
MODERATION_ENABLED = "0"
# AFFILIATE FLAG — DEFAULT OFF, fail-closed. Two routes WRITE the affiliate tables:
# /affiliate/click inserts into affiliate_clicks (unauthenticated, IP-rate-limited, device id
# hashed — not an injection or a PII leak, but a WRITABLE SURFACE NOTHING IN OUR PRODUCT REACHES),
# and /affiliate/postback inserts into conversions, which IS the commission record. Until
# 2026-09-10 the only thing keeping those tables empty was that the app never called them: the
# CLIENT was gated on affiliateActive() and the server accepted whatever arrived. That made
# privacy §11 a claim about our app rather than about our server. With this flag the claim moves
# from "our app cannot produce one" to "the server will not accept one".
# Flipping this to "1" is a committed, reviewable change and REQUIRES updating privacy §11 first.
AFFILIATE_ENABLED = "0"
